<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="img/logo.png">
<title>Devis Plaque de Plâtre & Placoplâtre Tunisie — La Maison Du Placoplâtre</title>
<meta name="description" content="Calculez votre devis placo en ligne en Tunisie : cloisons, plafonds suspendus, doublage et isolation. Devis gratuit Ariana & Grand Tunis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--creme:#FBF8F3;--blanc:#fff;--noir:#1C1B18;--gris:#5F5A52;--ligne:#E8E2D8;--or:#B08D4A;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Karla,sans-serif;color:var(--noir);background:var(--creme);line-height:1.75;padding:2rem 1rem}
  .conteneur{max-width:960px;margin:0 auto}
  h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,5vw,3.5rem);margin-bottom:.5rem}
  h1 em{color:var(--or);font-style:italic}
  .banner{width:100%;height:260px;object-fit:cover;border:1px solid var(--ligne);margin:1.5rem 0;display:block}
  .calc{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;margin-top:1.5rem;background:var(--blanc);padding:2.5rem;border:1px solid var(--ligne)}
  label{display:block;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gris);margin:1.15rem 0 .3rem}
  input,select{width:100%;padding:.7rem;border:none;border-bottom:1px solid var(--noir);background:transparent;font-family:Karla;font-size:1rem}
  input:focus,select:focus{outline:none;border-bottom-color:var(--or)}
  .chk{display:flex;align-items:center;gap:.6rem;margin-top:1.3rem;font-size:.95rem}
  .chk input{width:auto}
  .resultat{border:1px solid var(--ligne);background:var(--creme);padding:2.2rem}
  .resultat h3{margin-bottom:.6rem;font-family:'Cormorant Garamond',serif;font-size:1.5rem}
  table.recap{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem}
  table.recap td{padding:.4rem 0;border-bottom:1px dotted var(--ligne)}
  table.recap td:last-child{text-align:right;white-space:nowrap;color:var(--or);font-weight:500}
  table.recap .total td{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--noir);border-top:1px solid var(--noir);border-bottom:none;padding-top:.9rem}
  .note{font-size:.75rem;color:var(--gris);font-style:italic;margin-top:1rem}
  .btn{display:block;text-align:center;padding:1rem 2.4rem;text-decoration:none;font-size:.78rem;letter-spacing:.25em;text-transform:uppercase;transition:.3s;border:1px solid var(--noir);cursor:pointer;margin-top:1rem}
  .btn-noir{background:var(--noir);color:var(--creme)}
  .btn-noir:hover{background:transparent;color:var(--noir)}
  .retour{display:inline-block;margin-bottom:1.5rem;color:var(--noir);text-decoration:none;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid var(--or)}
  .galerie{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin-top:3rem}
  .galerie figure{background:var(--blanc);border:1px solid var(--ligne);overflow:hidden}
  .galerie img{width:100%;height:190px;object-fit:cover;display:block}
  .galerie figcaption{padding:.8rem 1rem;font-size:.82rem;color:var(--gris);text-align:center}
  @media(max-width:768px){.calc,.galerie{grid-template-columns:1fr}.banner{height:180px}}
</style>
</head>
<body>
<div class="conteneur">
 <a class="retour" href="index.html">← Retour au site principal</a>
 <h1>Devis en ligne — <em>Plaque de Plâtre</em></h1>
 <p style="color:var(--gris);">Chiffrez précisément vos cloisons, plafonds et doublages en Tunisie.</p>
 <img class="banner" src="https://images.pexels.com/photos/4981812/pexels-photo-4981812.jpeg?auto=compress&cs=tinysrgb&w=1200" alt="Pose de plaque de plâtre Tunisie">
 <div class="calc">
  <div>
   <div><label for="d-surface">Surface (m²)</label><input type="number" id="d-surface" min="1" max="10000" step="0.5" value="20" inputmode="decimal"></div>
   <div><label for="d-hauteur">Hauteur (m)</label><input type="number" id="d-hauteur" min="2" max="4" step="0.1" value="2.6" inputmode="decimal"></div>
   <div><label for="d-type">Type de travaux</label>
    <select id="d-type">
     <option value="cloison">Cloison — 75 DT/m²</option>
     <option value="plafondSimple">Plafond suspendu simple — 50 DT/m²</option>
     <option value="plafondDemontable">Plafond démontable — 65 DT/m²</option>
     <option value="doublage">Doublage — 85 DT/m²</option>
     <option value="isolation">Isolation — dès 20 DT/m²</option>
    </select></div>
   <div><label for="d-plaque">Type de plaque</label>
    <select id="d-plaque"><option value="standard">Standard</option><option value="hydrofuge">Hydrofuge</option><option value="coupeFeu">Coupe-feu</option></select></div>
   <div><label for="d-finition">Finition</label>
    <select id="d-finition"><option value="1">Bande + enduit (simple)</option><option value="1.15">Prête à peindre (+15 %)</option></select></div>
   <div><label for="d-montant">Montants</label>
    <select id="d-montant"><option value="m48">Montants 48</option><option value="m70">Montants 70</option></select></div>
   <label class="chk"><input type="checkbox" id="d-laine"> Ajouter la laine de verre (isolation)</label>
  </div>
  <div class="resultat">
   <h3>Votre devis estimatif placo</h3>
   <table class="recap" id="d-table"></table>
   <p class="note">Estimation indicative, TVA 19 % &amp; timbre fiscal (1 DT) inclus.</p>
   <a class="btn btn-noir" id="d-wa" href="#" target="_blank" rel="noopener">Envoyer le devis via WhatsApp</a>
  </div>
 </div>
 <div class="galerie">
  <figure><img src="https://images.pexels.com/photos/8488031/pexels-photo-8488031.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Cloison placo"><figcaption>Cloisons sur ossature métallique</figcaption></figure>
  <figure><img src="https://images.pexels.com/photos/6474123/pexels-photo-6474123.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Plafond suspendu"><figcaption>Plafonds suspendus &amp; spots</figcaption></figure>
  <figure><img src="https://images.pexels.com/photos/11427405/pexels-photo-11427405.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Doublage isolant"><figcaption>Doublage thermique &amp; phonique</figcaption></figure>
 </div>
</div>
<script>
const CONFIG = {
  identite: { nom: "La Maison Du Placoplâtre", whatsapp: "21622784561" },
  taxes: { tva: 0.19, timbre: 1 }, // timbre fiscal : montant fixe en DT (mettre 0 pour le retirer)
  /* ── PRIX D'ACHAT HT relevés sur les factures fournisseurs (nov. 2026) — à modifier ici ── */
  prix: {
    plaqueM2: { standard: 7.53,            // DT/m² — BA13 standard Knauf (facture)
                hydrofuge: 13.30,          // DT/m² — BA13 hydrofuge Knauf (catalogue Comaf 15,827 TTC/m², nov. 2026)
                coupeFeu: 14.25 },         // DT/m² — BA13 coupe-feu Knauf (catalogue Comaf 16,958 TTC/m², nov. 2026)
    montantMl: { m48: 3.26, m70: 3.89 },   // DT/ml
    railMl:    { m48: 2.73, m70: 3.25 },   // DT/ml (le rail suit le choix des montants)
    visMille: 22.028,                      // DT / paquet de 1000 vis 25 mm
    bandeRouleau: 30,                      // DT / rouleau de bande fibre 50 ml
    enduitSac: 30.91,                      // DT / sac d'enduit à joint 15 kg
    laineVerre: 8.40,                      // DT/m² — laine de verre Knauf Ultracoustic 45 mm (catalogue Comaf 8,988 TTC/m², TVA 7 %, nov. 2026)
    /* Plafond démontable 60×60 (ossature T24) */
    demontable: {
      dalleM2: 14.82,                      // DT/m² — dalle 60/60 Karolame
      porteurMl: 4.68,                     // DT/ml — porteurs Rockfon
      entretoise120Ml: 4.08,               // DT/ml
      entretoise60Ml: 4.86,                // DT/ml
      corniereMl: 2.99,                    // DT/ml — cornière en L
      tigeMl: 2.0,                         // DT/ml — tige lisse
      chevillePapillonMille: 78.51,        // DT / boîte de 1000
      ressortDoubleMille: 36.4,            // DT / boîte de 1000
      chevilleFrapperMille: 19.425         // DT / boîte de 1000
    },
    mainOeuvre: { cloison: 75, plafondSimple: 50, plafondDemontable: 65, doublage: 85, isolation: 20 }
  },
  /* ── HYPOTHÈSES DE CONSOMMATION (estimation indicative) ── */
  conso: {
    plaqueM2: 3.6,          // plaque 3000 × 1200 mm
    barreMl: 3,             // longueur d'un montant / rail
    bandeRouleauMl: 50,     // longueur d'un rouleau de bande
    bandeMlParM2: 1.2,      // mètres de bande par m² de plaque
    demontable: {
      pertes: 1.05,                        // +5 % de chutes
      porteurMlParM2: 1 / 1.2,             // porteurs tous les 1,20 m
      entretoise120MlParM2: 1 / 0.6,       // entretoises 1,20 m tous les 0,60 m
      entretoise60MlParM2: 1 / 1.2,        // entretoises 0,60 m (grille 60×60)
      suspentesParM2: 1 / (1.2 * 1.2),     // 1 suspente (tige + ressort + cheville papillon) par 1,44 m²
      longueurTigeM: 0.5,                  // longueur de tige lisse par suspente
      entraxeFrapperM: 0.5                 // 1 cheville à frapper tous les 0,50 m de cornière
    }
  }
};
const $ = id => document.getElementById(id);
const fmt = n => (isFinite(n) ? n.toFixed(2).replace('.', ',') : '—') + ' DT';
const sup = n => (isFinite(n) && n > 0) ? Math.max(1, Math.ceil(n - 1e-9)) : 0;
function lireNombre(id, min, max, defaut) {
  const el = $(id); if (!el) return defaut;
  let v = parseFloat(el.value);
  return (isFinite(v) && v >= min && v <= max) ? v : defaut;
}
function quantites(surface, hauteur, plaque, montant, laine, typeTravaux) {
  const s = surface, h = hauteur;
  const estPlafond = (typeTravaux === 'plafondSimple' || typeTravaux === 'plafondDemontable' || typeTravaux === 'isolation');
  const plaques = sup(s * 1.05 / CONFIG.conso.plaqueM2);
  let montants = estPlafond ? sup((s * 2.5) / 3) : sup(((h > 0 ? s / h : 0) / 0.6) * 1.1);
  let rails = estPlafond ? sup((4 * Math.sqrt(s)) / 3 * 1.1) : sup((h > 0 ? s / h : 0) * 2 / 3) + 1;
  return { plaques, montants, rails, visMille: sup(s * 13 / 1000) || 1, bandes: sup(s * CONFIG.conso.bandeMlParM2 / CONFIG.conso.bandeRouleauMl), enduit: sup(s / 20), laineM2: laine ? s : 0, plaque, montant };
}
function lignesDemontable(s) {
  const D = CONFIG.prix.demontable, K = CONFIG.conso.demontable;
  const perimetre = 4 * Math.sqrt(s);
  const dalles = sup(s * K.pertes);
  const porteurs = sup(s * K.porteurMlParM2 * K.pertes);
  const ent120 = sup(s * K.entretoise120MlParM2 * K.pertes);
  const ent60 = sup(s * K.entretoise60MlParM2 * K.pertes);
  const corniere = sup(perimetre * K.pertes);
  const suspentes = sup(s * K.suspentesParM2);
  const tigeMl = sup(suspentes * K.longueurTigeM);
  const frapper = sup(corniere / K.entraxeFrapperM);
  return [
    ['Dalles 60×60 (' + dalles + ' m²)', dalles * D.dalleM2],
    ['Porteurs (' + porteurs + ' ml)', porteurs * D.porteurMl],
    ['Entretoises 1,20 m (' + ent120 + ' ml)', ent120 * D.entretoise120Ml],
    ['Entretoises 0,60 m (' + ent60 + ' ml)', ent60 * D.entretoise60Ml],
    ['Cornière en L (' + corniere + ' ml)', corniere * D.corniereMl],
    ['Tiges lisses (' + tigeMl + ' ml)', tigeMl * D.tigeMl],
    ['Chevilles papillon ×' + suspentes, suspentes * D.chevillePapillonMille / 1000],
    ['Ressorts doubles ×' + suspentes, suspentes * D.ressortDoubleMille / 1000],
    ['Chevilles à frapper ×' + frapper, frapper * D.chevilleFrapperMille / 1000]
  ];
}
function calcDevis() {
  const s = lireNombre('d-surface', 1, 10000, 20);
  const h = lireNombre('d-hauteur', 2, 4, 2.6);
  const type = $('d-type').value;
  const finition = parseFloat($('d-finition').value) || 1;
  const q = quantites(s, h, $('d-plaque').value, $('d-montant').value, $('d-laine').checked, type);
  const P = CONFIG.prix, C = CONFIG.conso;
  const demontable = (type === 'plafondDemontable');
  ['d-plaque', 'd-finition', 'd-montant', 'd-laine'].forEach(id => {
    const el = $(id); el.disabled = demontable;
    const bloc = el.closest('label, div'); if (bloc) bloc.style.opacity = demontable ? '.4' : '';
  });
  let lignes;
  if (demontable) {
    lignes = lignesDemontable(s);
  } else {
    const m = $('d-montant').value;
    lignes = [
      ['Plaques BA13 ×' + q.plaques, q.plaques * P.plaqueM2[q.plaque] * C.plaqueM2 * finition],
      ['Montants ×' + q.montants + ' (barres de ' + C.barreMl + ' m)', q.montants * P.montantMl[m] * C.barreMl],
      ['Rails ×' + q.rails + ' (barres de ' + C.barreMl + ' m)', q.rails * P.railMl[m] * C.barreMl],
      ['Vis TRPF ×' + q.visMille + ' paquet(s) de 1000', q.visMille * P.visMille],
      ['Bande à joint ×' + q.bandes + ' rouleau(x) de ' + C.bandeRouleauMl + ' m', q.bandes * P.bandeRouleau],
      ['Enduit ×' + q.enduit + ' sac(s)', q.enduit * P.enduitSac]
    ];
    if (q.laineM2 > 0) lignes.push(['Laine de verre (' + q.laineM2 + ' m²)', q.laineM2 * P.laineVerre]);
  }
  const libMO = $('d-type').selectedOptions[0].text;
  lignes.push(['Main-d’œuvre — ' + libMO, s * P.mainOeuvre[type] * (demontable ? 1 : finition)]);
  const ht = lignes.reduce((t, l) => t + l[1], 0);
  const tva = ht * CONFIG.taxes.tva;
  const timbre = CONFIG.taxes.timbre;
  const ttc = ht + tva + timbre;
  let html = '';
  lignes.forEach(l => html += '<tr><td>' + l[0] + '</td><td>' + fmt(l[1]) + '</td></tr>');
  html += '<tr><td>Sous-total HT</td><td>' + fmt(ht) + '</td></tr><tr><td>TVA 19 %</td><td>' + fmt(tva) + '</td></tr><tr><td>Timbre fiscal</td><td>' + fmt(timbre) + '</td></tr><tr class="total"><td>TOTAL TTC</td><td>' + fmt(ttc) + '</td></tr>';
  $('d-table').innerHTML = html;
  const resume = 'Bonjour ' + CONFIG.identite.nom + ' ! Devis placo : ' + s + ' m² — ' + libMO + '. Total estimé : ' + ttc.toFixed(2) + ' DT TTC.';
  $('d-wa').href = 'https://wa.me/' + CONFIG.identite.whatsapp + '?text=' + encodeURIComponent(resume);
}
['d-surface','d-hauteur','d-type','d-plaque','d-finition','d-montant','d-laine'].forEach(id => $(id).addEventListener('input', calcDevis));
calcDevis();
</script>
</body>
</html>
